<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWS 模擬考題庫</title>
<style>
  :root{
    --bg:#0d0d0f;
    --panel:#161618;
    --panel-border:#2a2a2d;
    --orange:#ff7a1a;
    --orange-dim:#c95f0f;
    --text:#eceae6;
    --text-dim:#9a9691;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:48px 16px 60px;
  }
  .wrap{width:100%;max-width:760px;}
  header{
    border-bottom:1px solid var(--panel-border);
    padding-bottom:16px;
    margin-bottom:32px;
  }
  header h1{
    font-size:22px;
    font-weight:600;
    margin:0 0 6px;
    letter-spacing:.3px;
  }
  header h1 span{color:var(--orange);}
  header p{
    font-size:13px;
    color:var(--text-dim);
    margin:0;
  }
  .grid{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  a.card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:22px 24px;
    text-decoration:none;
    color:var(--text);
    transition:border-color .15s ease, transform .15s ease;
  }
  a.card:hover{
    border-color:var(--orange-dim);
    transform:translateY(-1px);
  }
  .card-code{
    font-size:12px;
    font-weight:600;
    color:var(--orange);
    letter-spacing:.5px;
    margin-bottom:6px;
  }
  .card-name{
    font-size:16px;
    font-weight:600;
  }
  .card-desc{
    font-size:13px;
    color:var(--text-dim);
    margin-top:4px;
  }
  .arrow{
    color:var(--orange);
    font-size:20px;
    flex-shrink:0;
  }
  footer{
    margin-top:36px;
    font-size:12px;
    color:var(--text-dim);
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AWS <span>模擬考</span>題庫</h1>
    <p>選擇要練習的證照，開始模擬測驗</p>
  </header>
  <div class="grid">
    <a class="card" href="./saa/">
      <div>
        <div class="card-code">SAA-C03</div>
        <div class="card-name">Solutions Architect – Associate</div>
        <div class="card-desc">解決方案架構師 助理級</div>
      </div>
      <div class="arrow">&rarr;</div>
    </a>
    <a class="card" href="./sap/">
      <div>
        <div class="card-code">SAP-C02</div>
        <div class="card-name">Solutions Architect – Professional</div>
        <div class="card-desc">解決方案架構師 專業級</div>
      </div>
      <div class="arrow">&rarr;</div>
    </a>
    <a class="card" href="./aif/">
      <div>
        <div class="card-code">AIF-C01</div>
        <div class="card-name">AI Practitioner</div>
        <div class="card-desc">AI 從業人員</div>
      </div>
      <div class="arrow">&rarr;</div>
    </a>
  </div>
  <footer>題庫來源：Examtopics</footer>
</div>
</body>
</html>
