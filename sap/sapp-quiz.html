<style>
  :root{
    --bg:#0d0d0f;
    --panel:#161618;
    --panel-border:#2a2a2d;
    --orange:#ff7a1a;
    --orange-dim:#c95f0f;
    --text:#eceae6;
    --text-dim:#9a9691;
    --green:#3ac16a;
    --red:#e8503f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:calc(32px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  }
  .wrap{width:100%;max-width:760px;}

  /* ---- fixed app-shell layout while answering (no page scroll) ---- */
  body.quiz-mode{
    height:100dvh;
    overflow:hidden;
    padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
  }
  body.quiz-mode .wrap{
    height:100%;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .quiz-top{flex:0 0 auto;}
  .quiz-scroll{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    padding:14px 0 10px;
    -webkit-overflow-scrolling:touch;
  }
  .quiz-bottom{flex:0 0 auto;}

  .jumpbtn{
    background:#1c1c1f;border:1px solid var(--panel-border);color:var(--orange);
    font-size:12px;font-weight:700;padding:5px 12px;border-radius:6px;
    flex:0 0 auto;
  }
  header .progress{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }

  .jumpdrawer-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .jumpdrawer{
    background:var(--panel);border:1px solid var(--panel-border);border-radius:16px 16px 0 0;
    width:100%;max-width:760px;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    max-height:70vh;overflow-y:auto;
  }
  .jumpdrawer-head{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:14px;font-weight:700;font-size:14px;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid var(--panel-border);
    padding-bottom:14px;
    margin-bottom:24px;
  }
  header h1{
    font-size:19px;
    font-weight:600;
    margin:0;
    letter-spacing:.3px;
  }
  header h1 span{color:var(--orange);}
  header .progress{font-size:13px;color:var(--text-dim);font-variant-numeric:tabular-nums;}

  .track{
    height:3px;background:var(--panel-border);border-radius:2px;margin-bottom:28px;overflow:hidden;
  }
  .track-fill{height:100%;background:var(--orange);transition:width .25s ease;}

  .qcard{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:26px 26px 22px;
  }
  .qnum{
    color:var(--orange);
    font-size:13px;
    font-weight:600;
    margin-bottom:10px;
    letter-spacing:.4px;
  }
  .qtext{
    font-size:16px;
    line-height:1.7;
    margin-bottom:22px;
    white-space:pre-wrap;
  }
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    display:flex;
    gap:12px;
    align-items:flex-start;
    text-align:left;
    background:#1c1c1f;
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:13px 16px;
    color:var(--text);
    font-size:14.5px;
    line-height:1.6;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .opt:hover{border-color:var(--orange-dim);}
  .opt.selected{
    border-color:var(--orange);
    background:#241a10;
  }
  .opt .tag{
    flex:0 0 auto;
    width:24px;height:24px;
    border-radius:6px;
    border:1px solid var(--panel-border);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:var(--text-dim);
  }
  .opt.selected .tag{border-color:var(--orange);color:var(--orange);}

  /* review mode coloring */
  .opt.correct{border-color:var(--green);background:#122318;}
  .opt.correct .tag{border-color:var(--green);color:var(--green);}
  .opt.wrong{border-color:var(--red);background:#2a1512;}
  .opt.wrong .tag{border-color:var(--red);color:var(--red);}

  .navrow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:24px;
  }
  .navrow .left, .navrow .right{display:flex;gap:10px;}
  button{
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    border-radius:7px;
    padding:11px 20px;
    cursor:pointer;
    border:1px solid var(--panel-border);
    background:#1c1c1f;
    color:var(--text);
    transition:opacity .15s, border-color .15s;
  }
  button:disabled{opacity:.35;cursor:not-allowed;}
  button:not(:disabled):hover{border-color:var(--orange-dim);}
  .btn-primary{
    background:var(--orange);
    border-color:var(--orange);
    color:#171008;
  }
  .btn-primary:not(:disabled):hover{opacity:.9;border-color:var(--orange);}

  .jumpgrid{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:22px;
  }
  .jumpgrid button{
    width:34px;height:34px;padding:0;
    font-size:12px;
    display:flex;align-items:center;justify-content:center;
  }
  .jumpgrid button.answered{border-color:var(--orange-dim);color:var(--orange);}
  .jumpgrid button.current{background:var(--orange);color:#171008;border-color:var(--orange);}

  /* results screen */
  .results{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:32px 28px;
    text-align:center;
  }
  .score-num{font-size:52px;font-weight:700;color:var(--orange);line-height:1;}
  .score-sub{color:var(--text-dim);font-size:14px;margin-top:8px;}
  .score-bar{
    height:8px;background:#1c1c1f;border-radius:4px;overflow:hidden;margin:22px 0;
    border:1px solid var(--panel-border);
  }
  .score-bar-fill{height:100%;background:var(--orange);}
  .reviewlist{margin-top:28px;text-align:left;display:flex;flex-direction:column;gap:14px;}
  .review-item{
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:16px 18px;
    background:#1c1c1f;
  }
  .review-item .rhead{
    display:flex;justify-content:space-between;align-items:center;
    font-size:12px;font-weight:700;margin-bottom:8px;letter-spacing:.3px;
  }
  .rhead.correct{color:var(--green);}
  .rhead.wrong{color:var(--red);}
  .review-item .rq{font-size:14px;line-height:1.6;margin-bottom:10px;color:var(--text);}
  .review-item .ropt{font-size:13px;line-height:1.6;padding:8px 10px;border-radius:6px;margin-bottom:6px;}
  .review-item .ropt.correct{background:#122318;color:var(--green);}
  .review-item .ropt.wrong{background:#2a1512;color:var(--red);}

  .restart{margin-top:26px;}
  .footnote{
    color:var(--text-dim);font-size:12px;text-align:center;margin-top:28px;line-height:1.6;
  }

  /* timer */
  .timer{
    font-variant-numeric:tabular-nums;
    font-size:15px;font-weight:700;color:var(--orange);
    border:1px solid var(--orange-dim);
    border-radius:7px;padding:6px 12px;
  }
  .timer.low{color:var(--red);border-color:var(--red);}
  .headtop{display:flex;justify-content:space-between;align-items:center;gap:12px;}

  .langtoggle{
    display:flex;gap:4px;background:#1c1c1f;border:1px solid var(--panel-border);
    border-radius:7px;padding:3px;
  }
  .langtoggle button{
    padding:6px 12px;font-size:12px;font-weight:700;border:none;border-radius:5px;
    background:transparent;color:var(--text-dim);
  }
  .langtoggle button.active{background:var(--orange);color:#171008;}
  .langtoggle button:hover:not(.active){border-color:transparent;color:var(--text);}

  .multihint{font-size:12px;color:var(--orange);margin-bottom:14px;font-weight:600;}

  .submitwarn{
    margin-top:16px;
    background:#2a1a10;
    border:1px solid var(--orange-dim);
    color:var(--orange);
    border-radius:8px;
    padding:11px 14px;
    font-size:13px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }
  .linklike{
    background:none;border:none;color:var(--text-dim);
    font-size:12px;text-decoration:underline;padding:0;cursor:pointer;
  }
  .linklike:hover{color:var(--text);border-color:transparent;}

  /* checkbox / radio indicator swap */
  .opt .tag.round{border-radius:50%;}

function t(){ return UI[lang]; }
function setLang(l){ lang=l; render(); }
function langToggleHtml(){
  return `<div class="langtoggle">
    <button class="${lang==='zh'?'active':''}" onclick="setLang('zh')">中文</button>
    <button class="${lang==='en'?'active':''}" onclick="setLang('en')">EN</button>
  </div>`;
}
function qStem(q){ return lang==='zh' ? q.q_zh : q.q_en; }
function qOptions(q){ return lang==='zh' ? q.options_zh : q.options_en; }

// ---- range selection for targeted review ----
const MAX_N=Math.max(...QUESTIONS.map(q=>q.n));
const RANGE_SIZE=100;
const RANGES=[{min:1, max:MAX_N, full:true}];
for(let start=1; start<=MAX_N; start+=RANGE_SIZE){
  const end=Math.min(start+RANGE_SIZE-1, MAX_N);
  RANGES.push({min:start, max:end, full:false});
}
function rangeLabel(r){ return r.full ? t().fullBank(r.max) : t().rangeLabel(r.min, r.max); }
let selectedRangeIndex=0;

function poolForRange(idx){
  const r=RANGES[idx];
  return QUESTIONS.filter(q=>q.n>=r.min && q.n<=r.max);
}

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function formatTime(s){
  const m=Math.floor(s/60);
  const sec=s%60;
  return String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}

function loadHistory(){
  try{
    const raw=localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}

function saveHistoryRecord(rec){
  try{
    const list=loadHistory();
    list.unshift(rec);
    if(list.length>50) list.length=50;
    localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
  }catch(e){}
}

function clearHistory(){
  if(!confirm(t().historyClearConfirm)) return;
  try{ localStorage.removeItem(HISTORY_KEY); }catch(e){}
  render();
}

function historySectionHtml(){
  const hist=loadHistory();
  const body = hist.length===0
    ? `<div class="history-empty">${t().historyEmpty}</div>`
    : `<div class="history-list">${hist.map((r,idx)=>{
        const d=new Date(r.date);
        const dateStr=isNaN(d) ? "" : d.toLocaleString(lang==='zh'?'zh-TW':'en-US',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
        return `<div class="history-row">
          <div class="h-info">
            <div class="h-date">${dateStr}</div>
            <div class="h-score">${r.correct}/${r.total} (${r.pct}%)</div>
            <div class="h-wrong">${t().historyWrong(r.wrong)}</div>
          </div>
          <button class="history-review-btn" onclick="openHistoryReview(${idx})">${t().historyReview}</button>
        </div>`;
      }).join("")}</div>`;
  return `
    <div class="history-section">
      <div class="history-head">
        <h3>${t().historyTitle}</h3>
        ${hist.length>0 ? `<button class="history-clear" onclick="clearHistory()">${t().historyClear}</button>` : ""}
      </div>
      ${body}
    </div>
  `;
}

let historyReviewIndex=null;

function openHistoryReview(idx){
  historyReviewIndex=idx;
  state="history";
  render();
  window.scrollTo(0,0);
}

function closeHistoryReview(){
  historyReviewIndex=null;
  state="start";
  render();
  window.scrollTo(0,0);
}

function renderHistoryReview(){
  const hist=loadHistory();
  const record=hist[historyReviewIndex];
  if(!record){
    state="start";
    return renderStart();
  }
  const items=record.items||[];
  let reviewHtml="";
  items.forEach(item=>{
    const q=QUESTIONS.find(qq=>qq.n===item.n);
    if(!q) return;
    const sel=item.sel||[];
    const isCorrect=arraysEqualAsSets(sel, q.answer);
    if(isCorrect) return;
    const opts=qOptions(q);
    let optsHtml="";
    opts.forEach((opt,j)=>{
      let cls="";
      if(q.answer.includes(j)) cls="correct";
      else if(sel.includes(j)) cls="wrong";
      if(cls) optsHtml+=`<div class="ropt ${cls}">${LETTERS[j]}. ${opt}</div>`;
    });
    if(sel.length===0){
      optsHtml=`<div class="ropt wrong">${t().notAnswered}</div>`+optsHtml;
    }
    reviewHtml+=`<div class="review-item">
      <div class="rhead wrong">${t().qnum(q.n)} — ${t().reviewWrong}${q.type==="multi"?t().reviewMulti:""}</div>
      <div class="rq">${qStem(q)}</div>
      ${optsHtml}
    </div>`;
  });
  if(!record.items){
    reviewHtml=`<div class="history-empty">${t().historyNoDetail}</div>`;
  }else if(reviewHtml===""){
    reviewHtml=`<div class="history-empty">${t().historyAllCorrect}</div>`;
  }
  const d=new Date(record.date);
  const dateStr=isNaN(d) ? "" : d.toLocaleString(lang==='zh'?'zh-TW':'en-US',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  return `
    <header>
      <div class="headtop">
        <h1>${t().appTitle}</h1>
        ${langToggleHtml()}
      </div>
      <div class="progress">${dateStr}</div>
    </header>
    <div class="results">
      <div class="score-sub">${t().historyReviewSub(record.correct, record.total)}</div>
      <button class="btn-primary restart" onclick="closeHistoryReview()">${t().backToStart}</button>
    </div>
    <div class="reviewlist">${reviewHtml}</div>
  `;
}

function render(){
  const app=document.getElementById('app');
  document.body.classList.toggle('quiz-mode', state==="quiz");
  if(state==="start"){
    app.innerHTML=renderStart();
  }else if(state==="quiz"){
    app.innerHTML=renderQuiz();
  }else if(state==="history"){
    app.innerHTML=renderHistoryReview();
  }else{
    app.innerHTML=renderResults();
  }
}

function renderStart(){
  const pool=poolForRange(selectedRangeIndex);
  const count=Math.min(EXAM_SIZE,pool.length);
  const note = pool.length < EXAM_SIZE
    ? `<p style="color:var(--orange);">${t().notEnough(pool.length)}</p>`
    : "";
  let optionsHtml="";
  RANGES.forEach((r,i)=>{
    optionsHtml+=`<option value="${i}" ${i===selectedRangeIndex?"selected":""}>${rangeLabel(r)}</option>`;
  });
  return `
    <header>
      <div class="headtop">
        <h1>${t().appTitle}</h1>
        ${langToggleHtml()}
      </div>
    </header>
    <div class="start-card">
      <h2>${t().startHeading}</h2>
      <p>${t().startDesc}</p>
      <div class="rangepick">
        <label for="rangeSelect">${t().reviewRange}</label>
        <select id="rangeSelect" onchange="onRangeChange(this.value)">${optionsHtml}</select>
      </div>
      <div class="meta-grid">
        <div class="meta-box"><div class="mnum">${count}</div><div class="mlabel">${t().metaCount}</div></div>
        <div class="meta-box"><div class="mnum">180</div><div class="mlabel">${t().metaTime}</div></div>
        <div class="meta-box"><div class="mnum">750</div><div class="mlabel">${t().metaPass}</div></div>
      </div>
      ${note}
      <button class="btn-primary" onclick="startExam()">${t().startBtn}</button>
      ${historySectionHtml()}
    </div>
    <div class="footnote">${t().footnote}</div>
  `;
}

function onRangeChange(val){
  selectedRangeIndex=parseInt(val,10);
  render();
}

function startExam(){
  const pool=poolForRange(selectedRangeIndex);
  const count=Math.min(EXAM_SIZE,pool.length);
  sessionQuestions=shuffle(pool).slice(0,count);
  answers=sessionQuestions.map(()=>[]);
  current=0;
  remainingSeconds=EXAM_SECONDS;
  jumpDrawerOpen=false;
  state="quiz";
  render();
  window.scrollTo(0,0);
  startTimer();
}

function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    remainingSeconds--;
    if(remainingSeconds<=0){
      remainingSeconds=0;
      clearInterval(timerInterval);
      updateTimerDom();
      submitQuiz();
      return;
    }
    updateTimerDom();
  },1000);
}

function updateTimerDom(){
  const el=document.getElementById('timer');
  if(!el) return;
  el.textContent=formatTime(remainingSeconds);
  if(remainingSeconds<=300) el.classList.add('low');
}

function renderQuiz(){
  const q=sessionQuestions[current];
  const pct=Math.round(((current+1)/sessionQuestions.length)*100);
  const isMulti=q.type==="multi";
  const selected=answers[current];
  const opts=qOptions(q);

  let optsHtml="";
  opts.forEach((opt,i)=>{
    const sel=selected.includes(i)?"selected":"";
    const tagCls=isMulti?"tag":"tag round";
    optsHtml+=`<div class="opt ${sel}" onclick="selectAnswer(${i})">
      <div class="${tagCls}">${LETTERS[i]}</div>
      <div>${opt}</div>
    </div>`;
  });

  let jumpHtml="";
  sessionQuestions.forEach((qq,i)=>{
    let cls="";
    if(i===current) cls="current";
    else if(answers[i].length>0) cls="answered";
    jumpHtml+=`<button class="${cls}" onclick="goTo(${i})">${i+1}</button>`;
  });

  const answeredCount=answers.filter(a=>a.length>0).length;
  const unansweredCount=sessionQuestions.length-answeredCount;

  const warnHtml = pendingSubmitConfirm
    ? `<div class="submitwarn">${t().warn(unansweredCount)}<button class="linklike" onclick="cancelSubmit()">${t().cancel}</button></div>`
    : "";

  const drawerHtml = jumpDrawerOpen ? `
    <div class="jumpdrawer-backdrop" onclick="toggleJumpDrawer()">
      <div class="jumpdrawer" onclick="event.stopPropagation()">
        <div class="jumpdrawer-head">
          <span>${t().reviewRange}</span>
          <button class="linklike" onclick="toggleJumpDrawer()">${t().cancel}</button>
        </div>
        <div class="jumpgrid">${jumpHtml}</div>
      </div>
    </div>` : "";

  return `
    <div class="quiz-top">
      <header>
        <div class="headtop">
          <h1>${t().appTitle}</h1>
          ${langToggleHtml()}
          <div class="timer" id="timer">${formatTime(remainingSeconds)}</div>
        </div>
        <div class="progress">
          <span>${t().progress(current+1, sessionQuestions.length, answeredCount)}</span>
          <button class="jumpbtn" onclick="toggleJumpDrawer()">#${current+1}</button>
        </div>
      </header>
      <div class="track"><div class="track-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="quiz-scroll">
      <div class="qcard">
        <div class="qnum">${t().qnum(q.n)}</div>
        <div class="qtext">${qStem(q)}</div>
        ${isMulti?`<div class="multihint">${t().multihint(q.answer.length)}</div>`:""}
        <div class="options">${optsHtml}</div>
      </div>
    </div>
    <div class="quiz-bottom">
      ${warnHtml}
      <div class="navrow">
        <div class="left">
          <button onclick="prevQ()" ${current===0?"disabled":""}>${t().prev}</button>
          <button onclick="nextQ()" ${current===sessionQuestions.length-1?"disabled":""}>${t().next}</button>
        </div>
        <div class="right">
          <button class="btn-primary" onclick="confirmSubmit()">${pendingSubmitConfirm?t().submitConfirm:t().submit}</button>
        </div>
      </div>
    </div>
    ${drawerHtml}
  `;
}

function arraysEqualAsSets(a,b){
  if(a.length!==b.length) return false;
  const sa=[...a].sort();
  const sb=[...b].sort();
  return sa.every((v,i)=>v===sb[i]);
}

function renderResults(){
  let correctCount=0;
  sessionQuestions.forEach((q,i)=>{ if(arraysEqualAsSets(answers[i],q.answer)) correctCount++; });
  const total=sessionQuestions.length;
  const pct=Math.round((correctCount/total)*100);

  let reviewHtml="";
  sessionQuestions.forEach((q,i)=>{
    const userAns=answers[i];
    const isCorrect=arraysEqualAsSets(userAns,q.answer);
    const opts=qOptions(q);
    let optsHtml="";
    opts.forEach((opt,j)=>{
      let cls="";
      if(q.answer.includes(j)) cls="correct";
      else if(userAns.includes(j)) cls="wrong";
      if(cls) optsHtml+=`<div class="ropt ${cls}">${LETTERS[j]}. ${opt}</div>`;
    });
    if(userAns.length===0){
      optsHtml=`<div class="ropt wrong">${t().notAnswered}</div>`+optsHtml;
    }
    reviewHtml+=`<div class="review-item">
      <div class="rhead ${isCorrect?'correct':'wrong'}">${t().qnum(q.n)} — ${isCorrect?t().reviewCorrect:t().reviewWrong}${q.type==="multi"?t().reviewMulti:""}</div>
      <div class="rq">${qStem(q)}</div>
      ${optsHtml}
    </div>`;
  });

  return `
    <header>
      <div class="headtop">
        <h1>${t().appTitle}</h1>
        ${langToggleHtml()}
      </div>
      <div class="progress">${t().resultsTitle}</div>
    </header>
    <div class="results">
      <div class="score-num">${pct}<span style="font-size:22px;">%</span></div>
      <div class="score-sub">${t().scoreSub(correctCount, total, formatTime(remainingSeconds))}</div>
      <div class="score-bar"><div class="score-bar-fill" style="width:${pct}%"></div></div>
      <button class="btn-primary restart" onclick="restart()">${t().restart}</button>
    </div>
    <div class="reviewlist">${reviewHtml}</div>
  `;
}

function selectAnswer(i){
  const q=sessionQuestions[current];
  const sel=answers[current];
  if(q.type==="multi"){
    const idx=sel.indexOf(i);
    if(idx>-1) sel.splice(idx,1);
    else sel.push(i);
  }else{
    answers[current]=[i];
  }
  pendingSubmitConfirm=false;
  const scrollY=window.scrollY;
  render();
  window.scrollTo(0,scrollY);
}
function prevQ(){ if(current>0){current--; pendingSubmitConfirm=false; render();} }
function nextQ(){ if(current<sessionQuestions.length-1){current++; pendingSubmitConfirm=false; render();} }
function goTo(i){ current=i; pendingSubmitConfirm=false; jumpDrawerOpen=false; render(); }
function cancelSubmit(){ pendingSubmitConfirm=false; render(); }
function toggleJumpDrawer(){ jumpDrawerOpen=!jumpDrawerOpen; render(); }
function confirmSubmit(){
  const unanswered=answers.filter(a=>a.length===0).length;
  if(unanswered>0 && !pendingSubmitConfirm){
    pendingSubmitConfirm=true;
    render();
    return;
  }
  pendingSubmitConfirm=false;
  submitQuiz();
}
function submitQuiz(){
  if(timerInterval) clearInterval(timerInterval);
  pendingSubmitConfirm=false;
  const total=sessionQuestions.length;
  let correctCount=0;
  sessionQuestions.forEach((q,i)=>{ if(arraysEqualAsSets(answers[i],q.answer)) correctCount++; });
  saveHistoryRecord({
    date:new Date().toISOString(),
    total,
    correct:correctCount,
    wrong:total-correctCount,
    pct:Math.round((correctCount/total)*100),
    timeUsedSec:EXAM_SECONDS-remainingSeconds,
    items:sessionQuestions.map((q,i)=>({n:q.n, sel:answers[i]})),
  });
  state="results";
  render();
  window.scrollTo(0,0);
}
function restart(){
  if(timerInterval) clearInterval(timerInterval);
  pendingSubmitConfirm=false;
  state="start";
  render();
  window.scrollTo(0,0);
}

render();
</script>
</body>
</html>
